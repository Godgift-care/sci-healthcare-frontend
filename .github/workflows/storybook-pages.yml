name: Storybook

# Builds Storybook from main and publishes it to GitHub Pages (#367), so a
# designer, translator or reviewer can browse every component without cloning
# the repository. The build is the same command CI runs (`build-storybook`),
# and the output uses relative asset paths, so it works from the project page's
# sub-path without extra configuration.
#
# One-time setup by a maintainer: Settings -> Pages -> Source: "GitHub Actions".
#
# A pull request cannot publish here: this workflow only runs on main (and by
# hand), and the build job has read-only access to the repository. Publishing
# needs `pages: write` and `id-token: write`, which only the deploy job gets.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

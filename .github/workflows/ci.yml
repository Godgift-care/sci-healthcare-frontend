name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the auto-merge bot run CI on main after it merges (merges made
  # with GITHUB_TOKEN do not trigger push workflows).
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Vitest unit tests for the pure helpers in src/lib (#77): money,
      # lifecycle, dispute codes and error mapping, with i128 boundaries.
      - run: npm run test:unit

  build:
    name: build
    runs-on: ubuntu-24.04
    # Every NEXT_PUBLIC_* value is inlined at build time and a production
    # build now refuses to start without the required ones (#76), so CI
    # supplies the testnet deployment's public contract ids (the same values
    # as vercel.json; public addresses, not secrets).
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
      NEXT_PUBLIC_REGISTRY_CONTRACT_ID: CAMU635NRFEHATJ6MTY5SI43IAZ43KHPFXAQDQAST2AHKCHLSGWHVE4V
      NEXT_PUBLIC_VOUCHER_CONTRACT_ID: CBPUQN6CNJCNGPKNEXB7UM4T7RINKQB7HQI5CXEOSQ5EFRHE4G4VKPSQ
      NEXT_PUBLIC_RECEIPT_CONTRACT_ID: CBCJRI2BCZBMZNX77WWDC2NGSV4ZNAN5Q23XHYNBH6UTOQMPJHZGX5C7
      NEXT_PUBLIC_USDC_CONTRACT_ID: CCRLJ7FEIKTR3GBT3VQQPSIJGRBO2WPNMVFKJDP6AYGJQWECOR4QVE5M
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Regression test for #76: without the required variables the build
      # must stop with a clear message rather than ship a bundle that fails
      # on its first contract call. It aborts while loading next.config.ts,
      # so this costs seconds, not a second compile.
      - name: build stops when configuration is missing
        env:
          NEXT_PUBLIC_VOUCHER_CONTRACT_ID: ''
        run: |
          if npm run build > /tmp/build-without-config.log 2>&1; then
            echo "::error::the build passed without NEXT_PUBLIC_VOUCHER_CONTRACT_ID"
            exit 1
          fi
          cat /tmp/build-without-config.log
          grep -q 'NEXT_PUBLIC_VOUCHER_CONTRACT_ID' /tmp/build-without-config.log

  storybook:
    name: storybook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build-storybook

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-24.04
    # Same build-time env as the build job; the app is measured as built.
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
      NEXT_PUBLIC_REGISTRY_CONTRACT_ID: CAMU635NRFEHATJ6MTY5SI43IAZ43KHPFXAQDQAST2AHKCHLSGWHVE4V
      NEXT_PUBLIC_VOUCHER_CONTRACT_ID: CBPUQN6CNJCNGPKNEXB7UM4T7RINKQB7HQI5CXEOSQ5EFRHE4G4VKPSQ
      NEXT_PUBLIC_RECEIPT_CONTRACT_ID: CBCJRI2BCZBMZNX77WWDC2NGSV4ZNAN5Q23XHYNBH6UTOQMPJHZGX5C7
      NEXT_PUBLIC_USDC_CONTRACT_ID: CCRLJ7FEIKTR3GBT3VQQPSIJGRBO2WPNMVFKJDP6AYGJQWECOR4QVE5M
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fails when LCP, total JS or accessibility exceed the budgets in
      # lighthouserc.json. Uploads a temporary-public-storage report whose
      # URL appears in the logs, linked from the PR.
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/

  visual:
    name: visual
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The web server builds the app itself (see playwright.config.ts), so
      # this compares screenshots with the backend mocked and the clock
      # frozen. After an intentional UI change, run
      # `npm run test:visual:update` locally and commit the new snapshots.
      - run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-test-results
          path: |
            test-results/
            playwright-report/

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The web server builds the app itself (see playwright.config.ts).
      # Each flow runs against a mocked API with a mock wallet and mock RPC
      # (see src/lib/e2e-seam.ts): no testnet, indexer or wallet needed.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/

  bot:
    name: auto-merge bot tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test .github/scripts/automerge.test.cjs .github/scripts/security-scan.test.cjs

  lockfile:
    name: lockfile (npm 10)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The change check diffs against the pull request's base commit,
          # which the default shallow checkout does not contain.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Did package-lock.json change?
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            # workflow_dispatch (the auto-merge bot runs CI on main this way)
            # has no base commit, so always check.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json is unchanged; skipping the npm 10 install check."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # A lockfile written by npm 11 (and some Dependabot updates) drops
      # entries npm 10 needs, which then fails `npm ci` in all the other jobs
      # at once with an error that does not say what to do (#365). This job is
      # deliberately cheap and only runs when the lockfile changed: --dry-run
      # resolves the tree without downloading it, --ignore-scripts runs
      # nothing.
      - name: Install the lockfile with npm 10
        if: steps.changed.outputs.changed == 'true'
        run: |
          if npm ci --ignore-scripts --dry-run; then
            echo "package-lock.json installs with npm $(npm -v)."
            exit 0
          fi
          echo "::error::package-lock.json does not install with npm $(npm -v) (the npm bundled with Node 22). It was probably written by a newer npm."
          echo "Fix it with the Node version CI uses:"
          echo "    nvm use              # Node 22 from .nvmrc, which ships npm 10"
          echo "    rm -rf node_modules package-lock.json"
          echo "    npm install          # rewrites the lockfile with npm 10"
          echo "    git add package-lock.json"
          echo "Do not hand-edit package-lock.json, and do not repair it with npm install under npm 11+ - that is what produced the broken lockfile."
          exit 1

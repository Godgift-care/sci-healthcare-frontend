name: CI

# ci.yml runs `npm ci` (install scripts included) and builds untrusted pull
# request code, so it holds a read-only token whatever the repository default
# is (#338). No job here writes to the repository or its issues.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the auto-merge bot run CI on main after it merges (merges made
  # with GITHUB_TOKEN do not trigger push workflows).
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:bindings
      - run: npm run typecheck

  unit:
    name: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Vitest unit tests for the pure helpers in src/lib (#77): money,
      # lifecycle, dispute codes and error mapping, with i128 boundaries —
      # plus the shared components (#348) and every Storybook story rendered
      # with axe (#350). Coverage of src/lib is enforced here too (#351): the
      # thresholds in vitest.config.mts fail the job and the summary says by
      # how much.
      - run: npm run test:unit:coverage

  build:
    name: build
    runs-on: ubuntu-24.04
    # Every NEXT_PUBLIC_* value is inlined at build time and a production
    # build now refuses to start without the required ones (#76), so CI
    # supplies the testnet deployment's public contract ids (the same values
    # as vercel.json; public addresses, not secrets).
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
      NEXT_PUBLIC_REGISTRY_CONTRACT_ID: CAMU635NRFEHATJ6MTY5SI43IAZ43KHPFXAQDQAST2AHKCHLSGWHVE4V
      NEXT_PUBLIC_VOUCHER_CONTRACT_ID: CBPUQN6CNJCNGPKNEXB7UM4T7RINKQB7HQI5CXEOSQ5EFRHE4G4VKPSQ
      NEXT_PUBLIC_RECEIPT_CONTRACT_ID: CBCJRI2BCZBMZNX77WWDC2NGSV4ZNAN5Q23XHYNBH6UTOQMPJHZGX5C7
      NEXT_PUBLIC_USDC_CONTRACT_ID: CCRLJ7FEIKTR3GBT3VQQPSIJGRBO2WPNMVFKJDP6AYGJQWECOR4QVE5M
      NEXT_PUBLIC_FAUCET_CONTRACT_ID: CCB25WG7DQ2CSNXPTOHZO2PDZ324FQPZLH3LSNCCLWYM3FEH52GEXC47
      NEXT_PUBLIC_USDC_ISSUER: GCKX5KAFVF7GLFZ3JWQGJ4F62RYYZU67PI3TACBGKVPJ73JELMI3L4KR
      NEXT_PUBLIC_SPONSORED_FEES: 'false'
      NEXT_PUBLIC_SEP24_ANCHORS: '[{"name":"Test clinic anchor","domain":"anchor.example","countries":["NG"],"assetCode":"USDC","assetIssuer":"GCKX5KAFVF7GLFZ3JWQGJ4F62RYYZU67PI3TACBGKVPJ73JELMI3L4KR"}]'
      NEXT_PUBLIC_PLAUSIBLE_DOMAIN: test.sci-healthcare.example
      NEXT_PUBLIC_SENTRY_DSN: https://localhost@sentry.example.com/42
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Regression test for #76: without the required variables the build
      # must stop with a clear message rather than ship a bundle that fails
      # on its first contract call. It aborts while loading next.config.ts,
      # so this costs seconds, not a second compile.
      - name: build stops when configuration is missing
        env:
          NEXT_PUBLIC_VOUCHER_CONTRACT_ID: ''
        run: |
          if npm run build > /tmp/build-without-config.log 2>&1; then
            echo "::error::the build passed without NEXT_PUBLIC_VOUCHER_CONTRACT_ID"
            exit 1
          fi
          cat /tmp/build-without-config.log
          grep -q 'NEXT_PUBLIC_VOUCHER_CONTRACT_ID' /tmp/build-without-config.log
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/
          include-hidden-files: true

  storybook:
    name: storybook
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build-storybook

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-24.04
    # Same build-time env as the build job; the app is measured as built.
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
      NEXT_PUBLIC_REGISTRY_CONTRACT_ID: CAMU635NRFEHATJ6MTY5SI43IAZ43KHPFXAQDQAST2AHKCHLSGWHVE4V
      NEXT_PUBLIC_VOUCHER_CONTRACT_ID: CBPUQN6CNJCNGPKNEXB7UM4T7RINKQB7HQI5CXEOSQ5EFRHE4G4VKPSQ
      NEXT_PUBLIC_RECEIPT_CONTRACT_ID: CBCJRI2BCZBMZNX77WWDC2NGSV4ZNAN5Q23XHYNBH6UTOQMPJHZGX5C7
      NEXT_PUBLIC_USDC_CONTRACT_ID: CCRLJ7FEIKTR3GBT3VQQPSIJGRBO2WPNMVFKJDP6AYGJQWECOR4QVE5M
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      # Fails when LCP, total JS or accessibility exceed the budgets in
      # lighthouserc.json. Uploads a temporary-public-storage report whose
      # URL appears in the logs, linked from the PR.
      - run: npx lhci autorun
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/

  visual:
    name: visual
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_USE_BUILD_ARTIFACT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The web server builds the app itself (see playwright.config.ts), so
      # this compares screenshots with the backend mocked and the clock
      # frozen. After an intentional UI change, run
      # `npm run test:visual:update` locally and commit the new snapshots.
      - run: npm run test:visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: visual-test-results
          path: |
            test-results/
            playwright-report/

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    # Same build-time env as the build job: the budget is measured on an
    # identical production build.
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
      NEXT_PUBLIC_REGISTRY_CONTRACT_ID: CAMU635NRFEHATJ6MTY5SI43IAZ43KHPFXAQDQAST2AHKCHLSGWHVE4V
      NEXT_PUBLIC_VOUCHER_CONTRACT_ID: CBPUQN6CNJCNGPKNEXB7UM4T7RINKQB7HQI5CXEOSQ5EFRHE4G4VKPSQ
      NEXT_PUBLIC_RECEIPT_CONTRACT_ID: CBCJRI2BCZBMZNX77WWDC2NGSV4ZNAN5Q23XHYNBH6UTOQMPJHZGX5C7
      NEXT_PUBLIC_USDC_CONTRACT_ID: CCRLJ7FEIKTR3GBT3VQQPSIJGRBO2WPNMVFKJDP6AYGJQWECOR4QVE5M
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Per-route first-load JavaScript against bundle-baseline.json (#344).
      # Lighthouse catches large regressions on three pages; this catches a
      # chunk growing on any route. The comparison also lands in the job
      # summary, which is where the pull request shows it.
      - name: Compare with the committed budget
        run: |
          set -o pipefail
          { echo '### Bundle budget'; echo '```'; npm run bundle:budget; echo '```'; } \
            | tee -a "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    # Three engines (#345) over two shards, so the extra coverage does not
    # multiply wall-clock time. fail-fast: false is deliberate: the value of
    # running every engine is seeing which ones fail.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The web server builds the app itself (see playwright.config.ts).
      # Each flow runs against a mocked API with a mock wallet and mock RPC
      # (see src/lib/e2e-seam.ts): no testnet, indexer or wallet needed.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/

  bot:
    name: auto-merge bot tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # workflow-policy.test.cjs enforces the supply-chain rules from #336-#338:
      # every action pinned to a commit SHA and every workflow declaring
      # permissions. It needs no install, so it runs in this job too.
      - run: node --test .github/scripts/automerge.test.cjs .github/scripts/security-scan.test.cjs .github/scripts/workflow-policy.test.cjs
